pool:
  name: Priyanshi

trigger:
  branches:
    include:
      - main
      - feature/*

stages:
  - stage: plan
    displayName: Plan
    jobs:
      - job: TerraformPlan
        displayName: Terraform Init
        steps:
          - task: TerraformTask@5
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              backendServiceArm: 'Service Connection'
              backendAzureRmStorageAccountName: 'arun1234'
              backendAzureRmContainerName: 'lokesh'
              backendAzureRmKey: 'terraform.tfstate'
