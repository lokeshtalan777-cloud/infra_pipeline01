trigger:
  branches:
    include:
      - main

pool:
  name: "Rovin kumar"

stages:
  - stage: Terraform
    displayName: "Terraform RG"
    jobs:
      - job: TerraformJob
        displayName: "Terraform Init Plan Apply"
        steps:

          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              backendServiceArm: "yaml"
              backendAzureRmStorageAccountName: "rovin12"
              backendAzureRmContainerName: "deepanshu"
              backendAzureRmKey: "terraform.tfstate"

          - task: TerraformTask@5
            displayName: "Terraform Apply"
            inputs:
              provider: "azurerm"
              command: "apply"
              environmentServiceNameAzureRM: "yaml"